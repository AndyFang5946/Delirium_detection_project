<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delirium Risk Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Raleway', sans-serif;
        }
        
        .container-main {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            color: #000000;
            margin-bottom: 30px;
            text-align: center;
            padding-bottom: 2.5px;
        }
        
        .header h1 {
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #000000;
        }
        
        .header p {
            color: #333333;
            font-weight: 300;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: #f5f5f5;
            border: 1px solid #000000;
            border-radius: 0;
            padding: 20px;
            box-shadow: none;
            text-align: center;
        }
        
        .summary-card h3 {
            color: #000000;
            font-size: 2rem;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .summary-card p {
            color: #333333;
            margin: 0;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .patients-container {
            background: white;
            border: 1px solid #000000;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }
        
        .patients-header {
            background: #000000;
            color: white;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .patients-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .patient-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #cccccc;
            transition: background-color 0.3s;
        }
        
        .patient-item:hover {
            background-color: #f0f0f0;
        }
        
        .patient-item:last-child {
            border-bottom: none;
        }
        
        .patient-info {
            flex: 1;
        }
        
        .patient-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #000000;
            margin-bottom: 5px;
        }
        
        .patient-details {
            font-size: 0.9rem;
            color: #555555;
            font-weight: 400;
        }
        
        .risk-badge {
            padding: 8px 16px;
            border-radius: 0;
            border: 2px solid #000000;
            font-weight: 600;
            font-size: 0.9rem;
            margin-right: 15px;
            min-width: 80px;
            text-align: center;
        }
        
        .risk-high {
            background-color: #000000;
            color: #ffffff;
        }
        
        .risk-medium {
            background-color: #666666;
            color: #ffffff;
        }
        
        .risk-low {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
        }
        
        .risk-percentage {
            font-weight: 700;
            font-size: 1.2rem;
            min-width: 60px;
            text-align: right;
            color: #000000;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666666;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #cccccc;
        }
        
        .refresh-btn {
            background: #ffffff;
            color: #000000;
            border: 2px solid #ffffff;
            padding: 10px 20px;
            border-radius: 0;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }
        
        .last-updated {
            color: #666666;
            font-size: 0.85rem;
            margin-top: 10px;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- Header -->
        <div class="header">
            <h1>Delirium Risk Monitor</h1>
            <p>Real-time patient monitoring and risk assessment</p>
        </div>
        
        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card">
                <i class="fas fa-users" style="font-size: 2rem; color: #000000;"></i>
                <h3 id="total-patients">0</h3>
                <p>Total Patients</p>
            </div>
            <div class="summary-card">
                <i class="fas fa-exclamation-circle" style="font-size: 2rem; color: #000000;"></i>
                <h3 id="high-risk-count">0</h3>
                <p>High Risk</p>
            </div>
            <div class="summary-card">
                <i class="fas fa-exclamation-triangle" style="font-size: 2rem; color: #666666;"></i>
                <h3 id="medium-risk-count">0</h3>
                <p>Medium Risk</p>
            </div>
            <div class="summary-card">
                <i class="fas fa-check-circle" style="font-size: 2rem; color: #000000;"></i>
                <h3 id="low-risk-count">0</h3>
                <p>Low Risk</p>
            </div>
        </div>
        
        <!-- Patients List -->
        <div class="patients-container">
            <div class="patients-header">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Patient List</span>
                    <button class="refresh-btn" onclick="refreshData()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
            
            <ul class="patients-list" id="patients-list">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No patients yet</p>
                </div>
            </ul>
            
            <div class="last-updated" style="padding: 10px 20px;">
                Last updated: <span id="last-update-time">--:--:--</span>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-refresh data every 5 seconds
        setInterval(refreshData, 5000);
        
        // Initial load
        refreshData();
        
        function refreshData() {
            // Fetch summary
            fetch('/api/summary')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total-patients').textContent = data.total_patients;
                    document.getElementById('high-risk-count').textContent = data.high_risk_count;
                    document.getElementById('medium-risk-count').textContent = data.medium_risk_count;
                    document.getElementById('low-risk-count').textContent = data.low_risk_count;
                })
                .catch(error => console.error('Error fetching summary:', error));
            
            // Fetch patients
            fetch('/api/patients')
                .then(response => response.json())
                .then(data => {
                    updatePatientsList(data);
                    document.getElementById('last-update-time').textContent = 
                        new Date().toLocaleTimeString();
                })
                .catch(error => console.error('Error fetching patients:', error));
        }
        
        function updatePatientsList(patients) {
            const patientsList = document.getElementById('patients-list');
            
            if (patients.length === 0) {
                patientsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No patients yet</p>
                    </div>
                `;
                return;
            }
            
            patientsList.innerHTML = patients.map(patient => `
                <li class="patient-item">
                    <div class="patient-info">
                        <div class="patient-name">${escapeHtml(patient.name)}</div>
                        <div class="patient-details">
                            <i class="fas fa-heartbeat"></i> ${Math.round(patient.heart_rate)} BPM | SpO2 ${patient.spo2.toFixed(1)}% | 
                            <i class="fas fa-thermometer-half"></i> ${patient.temperature.toFixed(1)}°C
                        </div>
                    </div>
                    <div class="risk-badge risk-${patient.risk_level.toLowerCase()}">
                        ${patient.risk_level}
                    </div>
                    <div class="risk-percentage">
                        ${(patient.delirium_risk * 100).toFixed(1)}%
                    </div>
                </li>
            `).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
